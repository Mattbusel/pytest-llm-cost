name: publish
# Publishes pytest-llm-cost to PyPI when a tag v<version> is pushed, for example v0.1.0.
# The tag must match the version in pyproject.toml and pytest_llm_cost.__version__.
#
# Uses PyPI trusted publishing (no API token): on pypi.org, add a trusted publisher (a pending
# one before the first release) for this repository, workflow publish.yml and environment pypi.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: the version matches pyproject.toml, __version__ and the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          grep -qx "__version__ = \"$version\"" src/pytest_llm_cost/__init__.py || { echo "__version__ is not $version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match $version"; exit 1; }
          fi
      - run: python -m pip install build -e '.[test]'
      - run: python -m pytest -q -W ignore::UserWarning
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-llm-cost/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
